<main><h1>#2 界面预览</h1><p class="m">commit bc8f62c · <a href="https://github.com/lingqiqi5211/moepie/pull/2">回到 PR</a> · 本次唯一的界面改动是供应商编辑弹窗里「压缩」（Codex 原生压缩）开关下方的说明文案：由“压缩过的对话只能在同一服务商和账号上继续”改为“官方 Codex 账号可在账号池内其他符合条件的账号上继续，其他服务商仍绑定原写入方，检查点不会被丢弃”；中文、繁体、日、德四套文案同步更新。其余改动都在网关内部（额度等待与恢复、SSE keepalive、检查点跨账号续接），不产生新的界面元素。</p>
