name: Docker 镜像构建

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/docker.yml]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/magpie

jobs:
  build:
    name: 构建镜像（${{ matrix.platform }}）
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    # native arm runner instead of QEMU
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 配置 Docker 构建环境
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 验证容器镜像
        run: |
          docker build --load \
            --cache-from type=gha,scope=${{ matrix.platform }} \
            --cache-to type=gha,scope=${{ matrix.platform }},mode=max \
            -t magpie-smoke .

          docker run -d --name smoke -v smoke-ci:/config -p 13425:3425 magpie-smoke

          READY=0
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:13425/v1/models; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1

          # a NAS panel's terminal opens bash or sh, with magpie on PATH
          docker exec smoke /bin/bash -c 'magpie healthcheck && ls /config >/dev/null'
          docker exec smoke /bin/sh -c 'echo sh works'

          CODE=$(curl -s -o /tmp/body.json -w '%{http_code}' \
            -H 'Authorization: Bearer magpie' -H 'Content-Type: application/json' \
            -d '{"model":"ci-unknown-model","messages":[{"role":"user","content":"hi"}]}' \
            http://127.0.0.1:13425/v1/chat/completions)
          echo "chat/completions answered HTTP $CODE"
          cat /tmp/body.json; echo
          (( CODE >= 400 && CODE < 500 ))
          jq -e '.error.type' /tmp/body.json > /dev/null

          OUT=$(docker run --rm -v smoke-ci:/config magpie-smoke provider add ci-smoke key=sk-ci url=https://example.com)
          echo "$OUT"
          echo "$OUT" | grep -q 'added ci-smoke'

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.sha }}
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max

      - name: 保存镜像摘要
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: 上传任务附件
        uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 合并并发布镜像清单
    if: github.event_name != 'pull_request'
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: 下载任务附件
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: 配置 Docker 构建环境
        uses: docker/setup-buildx-action@v4

      - name: 登录镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: 合并镜像清单并添加标签
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            TAGS=(-t "$IMAGE:$V")
            REF_TAG="$V"
            if [[ "$V" != *-* ]]; then
              TAGS+=(-t "$IMAGE:${V%.*}" -t "$IMAGE:${V%%.*}" -t "$IMAGE:latest")
            fi
          else
            TAGS=(-t "$IMAGE:edge")
            REF_TAG=edge
          fi
          DIGEST_ARGS=()
          for d in *; do DIGEST_ARGS+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${TAGS[@]}" "${DIGEST_ARGS[@]}"
          docker buildx imagetools inspect "$IMAGE:$REF_TAG"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$REF_TAG" --format '{{json .}}' | jq -r '.manifest.digest')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: 签署镜像构建来源
        uses: actions/attest-build-provenance@v3
        with:
          push-to-registry: true
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
